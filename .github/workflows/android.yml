name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установить зависимости
        run: npm install

      - name: Собрать веб-часть
        run: npm run build

      - name: Создать Android-проект
        run: |
          npx cap add android
          npm run assets -- --android
          npx cap sync android

      - name: Собрать APK для установки на телефон
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../GoldRa.apk

      # Файл для Google Play (.aab) собирается, когда в Settings → Secrets добавлены
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Собрать AAB для Google Play
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KS" | base64 -d > release.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          cp app/build/outputs/bundle/release/app-release.aab ../GoldRa.aab
          rm release.keystore

      - name: Сохранить файлы сборки
        uses: actions/upload-artifact@v4
        with:
          name: gold-ra-android
          path: |
            GoldRa.apk
            GoldRa.aab
          if-no-files-found: ignore

      - name: Выложить APK для скачивания
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Gold Ra для Android (последняя сборка)
          body: Скачайте GoldRa.apk на телефон Android и установите. Если телефон спросит, разрешите установку из этого источника.
          prerelease: true
          files: GoldRa.apk
